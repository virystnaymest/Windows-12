<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Windows 12 Web Edition</title>
  <desc id="desc">Rainbow gradient glass-style GitHub header</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#101936"/>
      <stop offset="100%" stop-color="#070a18"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b7f"/>
      <stop offset="16%" stop-color="#ff8a3d"/>
      <stop offset="33%" stop-color="#ffe45e"/>
      <stop offset="50%" stop-color="#46e6a6"/>
      <stop offset="66%" stop-color="#42c8ff"/>
      <stop offset="83%" stop-color="#7d6cff"/>
      <stop offset="100%" stop-color="#e85cff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".035"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="55" y="35" width="1090" height="230" rx="34"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <g filter="url(#blur)" opacity=".75">
    <circle cx="170" cy="55" r="90" fill="#ff3b9d"/>
    <circle cx="470" cy="270" r="120" fill="#36cfff"/>
    <circle cx="820" cy="45" r="110" fill="#7c5cff"/>
    <circle cx="1080" cy="245" r="120" fill="#35e5a2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="35" width="1090" height="230" rx="34" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/>
  </g>

  <g clip-path="url(#cardClip)" opacity=".18">
    <path d="M-50 210 C180 90 330 270 560 150 S930 40 1250 160" fill="none" stroke="url(#rainbow)" stroke-width="80"/>
  </g>

  <g transform="translate(100 87)">
    <rect width="54" height="54" rx="3" fill="#58caff"/>
    <path d="M0 27h54M27 0v54" stroke="#06101d" stroke-width="4" opacity=".7"/>
  </g>

  <text x="185" y="123" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-1">
    Windows 12 Web Edition
  </text>
  <rect x="187" y="143" width="510" height="5" rx="3" fill="url(#rainbow)"/>
  <text x="187" y="181" fill="#dbe7ff" fill-opacity=".78" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" letter-spacing=".4">
    Modern • Glass • Web • Concept
  </text>
  <text x="187" y="211" fill="#ffffff" fill-opacity=".5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">
    Build 26H12  •  v1.5  •  Created by Virystnaymest
  </text>

  <g transform="translate(940 98)">
    <circle cx="54" cy="54" r="49" fill="#ffffff" fill-opacity=".055" stroke="#ffffff" stroke-opacity=".14"/>
    <path d="M54 20v68M20 54h68" stroke="url(#rainbow)" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
